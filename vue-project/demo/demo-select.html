<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <style>
      table {
        width: 600px;
        color: #8f8e8e;
        text-align: center;
        border-collapse: collapse;
      }

      table thead {
        background: #f5f5f5;
      }

      table tr {
        height: 30px;
        line-height: 30px;
        border: 1px solid #ececec;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <table>
        <thead>
          <tr>
            <td>
              <input
                type="checkbox"
                v-model="data.selectedAll"
                @change="selectAllHandler"
              />
            </td>
            <td>商品</td>
            <td>单价</td>
            <td>库存</td>
            <td colspan="2">操作</td>
            <td>小计</td>
          </tr>
        </thead>
        <tbody>
          <tr v-for="(value, index) in data.list">
            <td>
              <input
                type="checkbox"
                v-model="data.checkboxList"
                :value="value"
                @change="checkSelect"
              />
            </td>
            <td>{{ value.name }}</td>
            <td>{{ value.price }}</td>
            <td>{{ value.stock }}</td>
            <td>
              <button @click="sub(value)">-</button>
              {{ value.number }}
              <button @click="add(value)">+</button>
            </td>
            <td><button @click="del(index,value.id)">删除</button></td>
            <td>{{ value.price*value.number }}</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <!-- <td>总价 {{ totalPrice() }}</td> -->
            <td>总价 {{ totalP }}</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <script type="module">
      import { createApp, reactive, computed, watch } from "./vue.esm-browser.js";

      createApp({
        setup() {
          const data = reactive({
            selectedAll: false,
            checkboxList: [],
            list: [
              {
                id: 1,
                name: "铅笔",
                price: 10,
                number: 1,
                stock: 3,
              },
              {
                id: 2,
                name: "鼠标",
                price: 20,
                number: 2,
                stock: 5,
              },
              {
                id: 3,
                name: "键盘",
                price: 30,
                number: 1,
                stock: 6,
              },
            ],
          });

          //减
          const sub = (value) => {
            if (value.number > 0) {
              value.number--;
            }
            console.log(data.checkboxList);
          };

          //加
          const add = (value) => {
            if (value.number < value.stock) {
              value.number++;
            }
            // console.log(data.checkboxList);
            
          };

          //删除
          const del = (index, id) => {
            data.list.splice(index,1)

            let newArr = data.checkboxList.filter(item => {
                return item.id != id
            })
            data.checkboxList = newArr
            checkSelect()
          };

          //总价-方法
          const totalPrice = () => {
            let total = 0
            for(let i of data.checkboxList ){
                // console.log(i);
                total += i.price*i.number
            }
            return total
          };

          //总价-计算属性
          const totalP = computed(()=>{
            let total = 0
            for(let i of data.checkboxList ){
                // console.log(i);
                total += i.price*i.number
            }
            return total
          })

          //全选/反选
          const selectAllHandler = () => {
            // console.log(data.selectedAll);

            if (data.selectedAll) {
              //true
              data.checkboxList = data.list;
            } else {
              //false
              data.checkboxList = [];
            }
          };

          //检查勾选状态
          const checkSelect = () => {
            // console.log(data.checkboxList);

            if (data.checkboxList.length != data.list.length || data.checkboxList.length == 0) {
              data.selectedAll = false;
            } else {
              data.selectedAll = true;
            }
          };

          return {
            data,
            sub,
            add,
            del,
            totalPrice,
            totalP,
            selectAllHandler,
            checkSelect,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
